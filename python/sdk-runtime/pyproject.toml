[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "cortex-runtime-bin"
version = "0.0.0.dev0"
description = "Pinned Cortex runtime for the Python SDK"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Cortex" }]

[project.urls]
Homepage = "https://github.com/local/cortex"
Documentation = "https://github.com/local/cortex/blob/master/python/sdk-runtime/README.md"
Issues = "https://github.com/local/cortex/issues"
Source = "https://github.com/local/cortex"

# Include the injected executable and default config; exclude the dev-only node
# closure from wheels and sdists.
[tool.hatch.build]
artifacts = ["src/cortex_harness_runtime/runtime/cortex-jsonrpc-agent-*"]
exclude = ["src/cortex_harness_runtime/runtime/node"]

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_harness_runtime"]

[tool.hatch.build.targets.wheel.hooks.custom]

[tool.hatch.build.targets.sdist.hooks.custom]
