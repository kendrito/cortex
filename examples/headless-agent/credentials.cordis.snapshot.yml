# Keyless dynamic-configuration composition: the base settings and credentials
# providers see only the isolated run home, no API key exists anywhere, and
# the cortex-official route still registers — so the prompt fails with the actionable
# MISSING_CREDENTIAL guidance this snapshot pins as first-run UX.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          # The endpoint is never dialed: credential resolution fails first.
          - id: llm-pi-ai
            name: '@cortex/llm-pi-ai'
            config:
              providers:
                cortex-official:
                  displayName: Cortex
                  apiKeyEnv: CORTEX_API_KEY
                  api: openai-completions
                  baseURL: 'http://127.0.0.1:9'
                  models:
                    - id: cortex-v4-flash
