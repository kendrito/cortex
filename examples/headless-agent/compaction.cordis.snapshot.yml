# Keyless context-overflow composition for the assembled compaction snapshot.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: compaction-basic
        name: '@cortex/compaction-basic'
        config:
          thresholdRatio: 0.99
          retainTokens: 20
          maxTokens: 32
      - insert:
          - id: llm-replay
            name: '@cortex/llm-replay'
            config:
              providers:
                - id: cortex-official
                  models:
                    - id: cortex-v4-flash
                      contextWindow: 128000
