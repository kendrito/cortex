# Keyless replay keeps the LSP composition intact and replaces only the model adapter.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ../cordis.yml
    patches:
      - insert:
          - id: lsp
            name: '@cortex/lsp'
          - id: lsp-stdio
            name: '@cortex/lsp-stdio'
            config:
              servers:
                fixture:
                  command: !!js process.execPath
                  args: ['./lsp-server.mjs']
                  extensionToLanguage:
                    '.ts': typescript
          - id: timeout-policy
            name: '@cortex/tool-call-timeout-policy'
          - id: tool-lsp
            name: '@cortex/tool-lsp'
            config:
              maxLocations: 1
          - id: llm-replay
            name: '@cortex/llm-replay'
