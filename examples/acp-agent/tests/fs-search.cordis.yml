# Minimal live counterpart for the glob-sampling snapshot composition.
- id: subprocess
  name: '@cortex/subprocess-local'

- id: bash
  name: '@cortex/bash-local'

- id: acp-agent
  name: '@cortex/acp-demo'
  config:
    provider: cortex-official
    model: cortex-v4-pro
    persistenceRoot: !!js process.env.CORTEX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: !!js "process.env.CORTEX_SNAPSHOT === undefined ? 'zstd' : 'none'"
    workspaceContext: false
    skills:
      enabled: false
    toolJobs: false
    goals: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-fs-search
  name: '@cortex/tool-fs-search'
  config:
    sampleOverCapGlobResults: true
    globMaxResults: 4
