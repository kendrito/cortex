# Minimal keyless composition: real app, pwsh executor, and pwsh tool; replayed model.
- id: llm-replay
  name: '@cortex/llm-replay'
  config:
    providers:
      - id: cortex-official
        name: Cortex
        models:
          - id: cortex-v4-pro

- id: subprocess
  name: '@cortex/subprocess-local'

- id: bash
  name: '@cortex/pwsh-local'

- id: shell-env
  name: '@cortex/shell-env'

- id: acp-agent
  name: '@cortex/acp-demo'
  config:
    provider: cortex-official
    model: cortex-v4-pro
    persistenceRoot: !!js process.env.CORTEX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
    persistenceCompression: none
    workspaceContext: false
    skills:
      enabled: false
    # job_output/job_kill stay mounted (the bundle's toolJobs default) so
    # background pwsh runs are readable and killable.
    goals: false
    # The pwsh tool replaces the bundle's bash tool in this composition.
    toolBash: false
    persona: You are a concise snapshot agent working in {{cwd}}.

- id: tool-pwsh
  name: '@cortex/tool-pwsh'
