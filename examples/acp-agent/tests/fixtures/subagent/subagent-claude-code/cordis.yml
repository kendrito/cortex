# Test-only composition of both public opt-in providers and foreground tools.
# The owning e2e boots this tree but never invokes a model or product process.
- id: fixture
  name: './fixture.ts'

- id: subagent
  name: '@cortex/subagent'

- id: subprocess
  name: '@cortex/subprocess-local'

- id: subagent-codex
  name: '@cortex/subagent-codex'

- id: subagent-claude-code
  name: '@cortex/subagent-claude-code'

- id: tool-subagent-codex
  name: '@cortex/tool-subagent'
  config:
    provider: codex
    toolName: subagent_codex
    enableRunInBackground: false
    maxDepth: 'provider-managed'

- id: tool-subagent-claude-code
  name: '@cortex/tool-subagent'
  config:
    provider: claude-code
    toolName: subagent_claude_code
    enableRunInBackground: false
    maxDepth: 'provider-managed'

- id: agent-spine
  name: '@cortex/agent-spine-demo'
  config:
    agents:
      - id: main
        provider: mock
        model: mock-delegate
        cwd: !!js process.cwd()
    persona: 'This composition test must not start a model turn.'
    workspaceContext: false

- id: persistence
  name: '@cortex/session-persistence-jsonl'
  config:
    root: './.sessions'

- id: checkpoint-policy
  name: '@cortex/session-checkpoint-policy'
