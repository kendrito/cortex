# Session-title snapshot composition: the optional first-prompt provider uses
# the ordinary Cortex route while the ACP app and every other capability stay
# identical to the base example.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: session-title-provider
            name: '@cortex/session-title-first-prompt-llm'
            config:
              targetWords: 5
              maxInputBytes: 4096
              maxOutputTokens: 32
              timeoutMs: 5000
              provider: cortex-official
              model: cortex-v4-flash
