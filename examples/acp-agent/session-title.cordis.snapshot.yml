# Keyless session-title composition. Main-agent chunks derive from session.jsonl;
# the auxiliary route consumes replay.override.json with pacing so its accepted
# title commits only after the main turn has closed.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@cortex/acp-demo'
        config:
          provider: cortex-official
          model: cortex-v4-flash
          persistenceRoot: !!js process.env.CORTEX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay-main
            name: '@cortex/llm-replay'
            config:
              overrideFile: ./.missing-main-replay-override.json
              providers:
                - id: cortex-official
                  name: Cortex
                  models:
                    - id: cortex-v4-flash
          - id: llm-replay-title
            name: '@cortex/llm-replay'
            config:
              paceMs: 10
              providers:
                - id: title-replay
                  name: Title replay
                  models:
                    - id: title-model
          - id: session-title-provider
            name: '@cortex/session-title-first-prompt-llm'
            config:
              targetWords: 5
              maxInputBytes: 4096
              maxOutputTokens: 32
              timeoutMs: 5000
              provider: title-replay
              model: title-model
