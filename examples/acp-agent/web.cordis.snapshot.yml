# Keyless replay counterpart to web.cordis.yml: the web stack and loopback
# fixture server stay real (the tool call re-executes the actual HTTP fetch and
# markdown rendering); only the model adapter is replaced by replay.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: web
            name: '@cortex/web'
          - id: web-fetch-http
            name: '@cortex/web-fetch-http'
          - id: web-fetch-fixture
            name: './web-fetch-fixture-server.mjs'
          - id: tool-web
            name: '@cortex/tool-web'
            config:
              search: false
          - id: llm-replay
            name: '@cortex/llm-replay'
            config:
              providers:
                - id: cortex-official
                  name: Cortex
                  models:
                    - id: cortex-v4-flash
                    - id: cortex-v4-pro
