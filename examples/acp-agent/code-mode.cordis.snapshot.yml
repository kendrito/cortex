# Keyless Code Mode combines the runtime/registry patch with the Cortex-to-replay
# swap. Include patches cannot target entries behind a nested include, so this file
# applies both overlays directly to `cordis.yml`.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@cortex/acp-demo'
        config:
          provider: cortex-official
          model: cortex-v4-flash
          persistenceRoot: !!js process.env.CORTEX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
          tools:
            mode: code
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: code-runtime
            name: '@cortex/code-runtime-worker-thread'
          - id: llm-replay
            name: '@cortex/llm-replay'
            config:
              providers:
                - id: cortex-official
                  name: Cortex
                  models:
                    - id: cortex-v4-flash
                    - id: cortex-v4-pro
