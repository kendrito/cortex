# Keyless twin of product-subagent-both.cordis.yml: preserve both product
# tools while replacing only the external model adapter.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: llm-replay
            name: '@cortex/llm-replay'
            config:
              providers:
                - id: cortex-official
                  name: Cortex
                  models:
                    - id: cortex-v4-flash
                    - id: cortex-v4-pro
          - id: subagent-codex
            name: '@cortex/subagent-codex'
          - id: subagent-claude-code
            name: '@cortex/subagent-claude-code'
          - id: tool-subagent-codex
            name: '@cortex/tool-subagent'
            config:
              provider: codex
              toolName: subagent_codex
              enableRunInBackground: false
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@cortex/tool-subagent'
            config:
              provider: claude-code
              toolName: subagent_claude_code
              enableRunInBackground: false
              maxDepth: provider-managed
