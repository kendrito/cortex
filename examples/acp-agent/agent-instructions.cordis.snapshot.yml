# Keyless replay counterpart of agent-instructions.cordis.yml. Patches do not
# compose across includes, so this applies the scenario config and model swap
# directly to the live tree.
- id: base
  name: '@cortex/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: acp-agent
        name: '@cortex/acp-demo'
        config:
          provider: cortex-official
          model: cortex-v4-flash
          persistenceRoot: !!js process.env.CORTEX_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
            cortexHome: !!js process.cwd() + '/.cortex'
            projectRootMarkers:
              - .cortex-project
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@cortex/llm-replay'
          - id: workspace-context-compaction
            name: './tests/fixtures/workspace-context-compaction.ts'
