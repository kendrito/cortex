# Unattended coding-agent deployment for the bundled cortex-jsonrpc-agent runtime.
# stdout is reserved for JSON-RPC; do not add a console logger or terminal UI.

- id: sdk-jsonrpc-server
  name: '@cortex/sdk-jsonrpc-server'
  config:
    maxTokensAsSuccess: !!js "process.env.CORTEX_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.CORTEX_MAX_TOKENS_AS_SUCCESS)"

- id: subprocess
  name: '@cortex/subprocess-local'

- id: bash
  name: '@cortex/bash-local'
  config:
    cwd: !!js process.env.CORTEX_CWD ?? process.cwd()
    timeoutMs: 60000

- id: agent-spine
  name: '@cortex/agent-spine-demo'
  config:
    persona: !!js process.env.CORTEX_SYSTEM_PROMPT ?? 'You are a coding agent.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

- id: sessions
  name: '@cortex/session-persistence-jsonl'
  config:
    root: !!js process.env.CORTEX_SESSION_ROOT ?? './.sessions'
    # Snapshot runs read the raw JSONL back; production keeps zstd frames.
    compression: !!js "process.env.CORTEX_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: session-checkpoints
  name: '@cortex/session-checkpoint-policy'

- id: subagent
  name: '@cortex/subagent'

- id: subagent-spawn-in-process
  name: '@cortex/subagent-spawn-in-process'
  config:
    providerName: spawn

- id: tool-subagent
  name: '@cortex/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    enableRunInBackground: false

- id: tool-todo
  name: '@cortex/tool-todo'
  config:
    allowParallelInProgress: true

- id: fs-local
  name: '@cortex/fs-local'
  config:
    cwd: !!js process.env.CORTEX_CWD ?? process.cwd()

- id: fs-observation-policy
  name: '@cortex/fs-observation-policy'

- id: tool-fs
  name: '@cortex/tool-fs'

- id: token-meter
  name: '@cortex/token-meter'

- id: compaction-basic
  name: '@cortex/compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.16
    maxTokens: 8192
    compactionRetries: 1
