# Keyless generic ACP v1 control-surface patch over `cortex --profile acp`.

- id: acp
  name: '@cortex/acp'
  config:
    provider: control-fixture
    model: alpha

- id: session-persistence-jsonl
  name: '@cortex/session-persistence-jsonl'
  config:
    root: !!js process.env.CORTEX_CONFORMANCE_PERSISTENCE_ROOT
    compression: none

- insert:
    - id: control-surface-llm
      name: './control-surface-llm.ts'
