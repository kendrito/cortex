# Missing-credential patch over the shipped headless profile. The replacement
# adapter registers the production route but cannot reach its endpoint.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

# The historical route/model labels are retained for recorded fixture compatibility.
- id: llm-pi-ai
  config:
    providers:
      deepseek-official:
        api: openai-completions
        baseURL: 'http://127.0.0.1:9'
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - id: deepseek-v4-flash
            contextWindow: 128000
            maxTokens: 8192

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-flash
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: none
