# Test-only agent and persistence patch over the shipped base + headless
# profile. The shared driver owns the turn, so the product runner stays off.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

# This fixture has no remote endpoint or provider defaults.
- id: llm-pi-ai
  config:
    providers:
      test-local:
        api: openai-completions
        baseURL: !!js process.env.CORTEX_TEST_BASE_URL
        apiKeyEnv: !!js "process.env.CORTEX_TEST_API_KEY ? 'CORTEX_TEST_API_KEY' : undefined"
        headers: !!js "process.env.CORTEX_TEST_API_KEY ? {} : { Authorization: 'Bearer cortex-local-test' }"
        models:
          - id: !!js process.env.CORTEX_TEST_MODEL
            contextWindow: 128000
            maxTokens: 8192

- id: agent-loop
  config:
    agents:
      - id: main
        provider: test-local
        model: !!js process.env.CORTEX_TEST_MODEL
        cwd: !!js process.cwd()

- id: session-persistence-jsonl
  config:
    root: './.sessions'
    compression: !!js "process.env.CORTEX_SNAPSHOT === undefined ? 'zstd' : 'none'"
