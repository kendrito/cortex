# Keyless filesystem snapshots combine spill settings with replay. The
# sandboxed filesystem stack already lives in `cortex-base`; the ACP row re-pins
# `deepseek-v4-flash` for the recorded corpus.
- id: llm-deepseek
  name: '@cortex/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@cortex/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash

- id: session-persistence-jsonl
  name: '@cortex/session-persistence-jsonl'
  config:
    root: !!js cortexHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@cortex/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@cortex/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@cortex/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- id: spill-local
  name: '@cortex/spill-local'
  config:
    root: !!js process.env.CORTEX_SNAPSHOT_SPILL_ROOT ?? './.spill'

- id: spill-policy
  name: '@cortex/spill-policy'
  config:
    maxInlineTokens: 200

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.CORTEX_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.CORTEX_SNAPSHOT_SPILL_LOCATOR_ROOT
