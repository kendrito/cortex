# Keyless replay for the read-image success scenario. This profile patch swaps
# the adapter and re-pins the recorded vision model. The replay catalog declares image input,
# so the strict read_image gate accepts the route and the tool result carries
# the durable image block.
- id: llm-deepseek
  name: '@cortex/llm-deepseek-api-key'
  disabled: true

- id: agent-default-model
  name: '@cortex/agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: session-persistence-jsonl
  name: '@cortex/session-persistence-jsonl'
  config:
    root: !!js cortexHomePath('sessions')
    compression: none

- id: agent-instructions
  name: '@cortex/agent-instructions'
  config:
    maxBytes: 65536

- id: system-prompt
  name: '@cortex/system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: llm-replay
      name: '@cortex/llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                inputModalities: [text]
              - id: deepseek-v4-pro
                inputModalities: [text]
              - id: deepseek-v4-flash-vision-exp
                inputModalities: [text, image]
                imageRequestTokens: 169

- id: attachment-local
  name: '@cortex/attachment-local'

- id: spill-policy
  name: '@cortex/spill-policy'
  config:
    maxInlineTokens: 1000

- insert:
    - name: './fixture.mjs'

- id: spill-local
  name: '@cortex/spill-local'
  config:
    root: !!js process.env.CORTEX_SNAPSHOT_SPILL_ROOT ?? './.spill'

- insert:
    - id: snapshot-spill-locators
      name: ../../../scripts/snapshot-spill-locators.ts
      config:
        root: !!js process.env.CORTEX_SNAPSHOT_SPILL_ROOT
        locatorRoot: !!js process.env.CORTEX_SNAPSHOT_SPILL_LOCATOR_ROOT
