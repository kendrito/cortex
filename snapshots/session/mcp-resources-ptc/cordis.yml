- insert:
    - id: mcp-resource-catalog
      name: '@cortex/mcp-client'
      config:
        transport: stdio
        serverName: catalog
        command: !!js process.execPath
        args: !!js '[process.env.CORTEX_MCP_RESOURCES_FIXTURE]'
        failOnStartupError: true
        reconnect:
          enabled: false

- id: tools
  name: '@cortex/tools'
  config:
    mode: ptc
